site_name: ASGBD - PostgreSQL

exclude_docs: |
  *copy*.md
  *copy 2.md
  -*.md
site_description: Administración de Sistemas Gestores de Bases de Datos
site_author: Noelia Beltrán - IES EL CAMINÀS

theme:
  name: material
  language: es
  logo: img/logo-ies-el-caminas-2.webp
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Cambiar al modo noche
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Cambiar al modo día
  features:
    - navigation.footer
#    - navigation.expand
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.highlight
    - content.code.copy
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/sql-role-attributes.js

copyright: >-
  IES EL CAMINÀS<br>
  © 2026 Noelia Beltrán — <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">Licencia CC BY-NC-SA 4.0</a>

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.superfences

nav:
  - Inicio: index.md

  - Entorno de trabajo:
    - Cloud con AWS Academy: ud_entorno_trabajo/aws/
    - Local con Máquinas Virtuales: ud_entorno_trabajo/local/
    - Local con Contenedores Docker: ud_entorno_trabajo/docker/

  - "UD0: Introducción":
      - Inicio: ud0/index.md
      - 1. ¿Qué es un SGBD?: ud0/01-sgbd.md
      - 2. Arquitectura: ud0/02-arquitectura-niveles.md
      - 3. Componentes: ud0/03-componentes-sgbd.md
      - 4. Modelos de explotación: ud0/04-modelos-explotacion.md
      - 5. Tareas del DBA: ud0/05-tareas-dba.md
      - Actividades: ud0/00-actividades.md      

  - "UD1: Implantación":
      - Inicio: ud1/index.md
      - 1. Antes de implantar: ud1/01-antes-implantar.md
      - 2. PostgreSQL como SGBD base: ud1/02-sgbd-postgresql.md
      - 3. Instalación del servidor: ud1/03-instalacion-servidor.md
      - 4. Instalación de clientes: ud1/04-instalacion-clientes.md
      - Actividades: ud1/00-actividades.md

  - "UD2: Configuración":
       - Inicio: ud2/index.md
       - 1. Configuración del SGBD: ud2/01-configuracion-sgbd.md
       - 2. postgresql.conf: ud2/02-conf-postgresql.md
       - 3. pg_hba.conf: ud2/03-conf-pg_hba.md
       - 4. pg_ident.conf: ud2/04-conf-pg_ident.md
       - 5. Puesta en marcha y comprobación: ud2/05-puesta-en-marcha.md
       - Actividades: ud2/00-actividades.md
      
  - "UD3: Control de acceso":
      - Inicio: ud3/index.md
      - 1. Control de acceso y organización lógica: ud3/01-control-acceso-organizacion.md
      - 2. Roles y membresías de roles: ud3/02-roles-membresias.md
      - 3. Gestión de bases de datos y objetos: ud3/03-basesdatos-objetos.md
      - 4. Privilegios sobre objetos: ud3/04-privilegios-objetos.md
      - 5. Copias de seguridad y restauración: ud3/05-copias-restauracion.md
      - 6. Administración gráfica con pgAdmin: ud3/06-pgadmin.md
      - 7. Ejemplos guiados: ud3/07-ejemplos_guiados.md
      - Actividades: ud3/00-actividades.md
      - Anexo. PostgreSQL con Docker: ud3/08-anexo-postgresql-docker.md
      #- Prácticas de laboratorio: ud3/09-practicas-laboratorio.md

