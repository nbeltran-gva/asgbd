site_name: ASGBD
site_description: Administración de Sistemas Gestores de Bases de Datos
site_author: Noelia Beltrán - IES EL CAMINÀS

theme:
  name: material
  language: es
  logo: img/logo-ies-el-caminas-2.webp
  extra_css:
    - stylesheets/extra.css
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Cambiar al modo noche
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Cambiar al modo día
  features:
    - navigation.footer
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.highlight
    - content.code.copy

copyright: >-
  IES EL CAMINÀS<br>
  © 2026 Noelia Beltrán — <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">Licencia CC BY-NC-SA 4.0</a>

